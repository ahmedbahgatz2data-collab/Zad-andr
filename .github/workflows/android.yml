name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Debug - Initial files
        run: ls -R

      - name: Install Dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Project
        run: |
          export CI=false
          npm run build
        
      - name: Check dist directory
        run: |
          if [ -d "dist" ]; then
            ls -R dist
          else
            echo "Error: dist directory was not created!"
            exit 1
          fi

      - name: Fix line endings and permissions
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            sed -i 's/\r$//' gradlew
            cd ..
          fi

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found, adding platform..."
            npx cap add android
          else
            echo "Android directory exists."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          TERM: dumb

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
