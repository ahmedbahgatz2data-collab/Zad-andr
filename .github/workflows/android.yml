name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Debug - List files
        run: ls -R

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: |
          export CI=false
          npm run build

      - name: Check dist directory
        run: ls -R dist

      - name: Fix line endings and permissions
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            sed -i 's/\r$//' gradlew
            cd ..
          fi

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found, adding platform..."
            npx cap add android
          else
            echo "Android directory exists."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create placeholder google-services.json if missing
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Creating placeholder google-services.json..."
            echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.zad.app"}},"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"status":1}}}]}' > android/app/google-services.json
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
